name: DPRO DISPOSAL Product READY R2 Apply and Fresh QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-DISPOSAL-PRODUCT-READY-R2.yml'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASELINE_SHA: 6df32db2b552140a9e870818bdd6d6fe53d90bf8
  ADAPTER_BASE: https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-disposal-control-adapter
  FRONT_BASE: https://dpromstk2000-lab.github.io/dpro-disposal-line-liff
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/disposal.html
  LP_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-disposal.html
  A4_HTML_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-disposal.html
  A4_PDF_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-disposal.pdf
  FRONTEND_VERSION: DISPOSAL-PR2-FRONTEND-20260824
  ADAPTER_VERSION: DPRO-CONTROL-ADAPTER-1.0-DISPOSAL-20260824-R2
  DATABASE_VERSION: DISPOSAL-DB-PR2-20260824

concurrency:
  group: dpro-disposal-product-ready-r2
  cancel-in-progress: false

jobs:
  apply-and-qa:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'DISPOSAL R2 QA evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard baseline and scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          mapfile -t CHANGED < <(git diff --name-only "$BASELINE_SHA"..HEAD)
          for f in "${CHANGED[@]}"; do
            if [[ "$f" != ".github/workflows/STEP-DISPOSAL-PRODUCT-READY-R2.yml" ]]; then
              echo "Unexpected pre-R2 drift: $f" >&2
              exit 2
            fi
          done
          mkdir -p product-ready-evidence/disposal-r2/screens
          printf 'baseline=%s\nworkflow_start=%s\n' "$BASELINE_SHA" "$(git rev-parse HEAD)" > product-ready-evidence/disposal-r2/source-guard.txt

      - name: Apply R2 secure frontend bridge
        shell: bash
        run: |
          set -euo pipefail
          cat > config.js <<'DPRO_CONFIG_EOF'
          window.DPRO_DISPOSAL_CONFIG = Object.freeze({
            API_BASE: "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-disposal-control-adapter",
            COMPANY_CODE: "dpro_disposal_demo",
            VERSION: "DISPOSAL-PR2-FRONTEND-20260824",
            FRONTEND_VERSION: "DISPOSAL-PR2-FRONTEND-20260824",
            ADAPTER_VERSION: "DPRO-CONTROL-ADAPTER-1.0-DISPOSAL-20260824-R2",
            DATABASE_VERSION: "DISPOSAL-DB-PR2-20260824",
            LIFF_ID: "",
            DEFAULT_LINE_USER_ID: ""
          });

          /* DPRO DISPOSAL PRODUCT READY R2 SECURITY BRIDGE */
          (() => {
            "use strict";
            const CFG = window.DPRO_DISPOSAL_CONFIG;
            const API_BASE = String(CFG.API_BASE || "").replace(/\/$/, "");
            const COMPANY_CODE = CFG.COMPANY_CODE || "dpro_disposal_demo";
            const RAW_FETCH = window.fetch.bind(window);
            const page = (window.location.pathname.split("/").pop() || "index.html").toLowerCase();
            const params = new URLSearchParams(window.location.search);
            const IS_DEMO = params.get("demo") === "1" || COMPANY_CODE.includes("demo");
            const ROLE = page === "staff.html" ? "staff" : (["owner.html", "system-check.html"].includes(page) ? "owner" : "public");
            const SESSION_KEY = ROLE === "staff" ? "dpro_disposal_staff_session" : "dpro_disposal_owner_session";
            let authPromise = null;
            let liffInitPromise = null;

            function normalizePhone(value) {
              let s = String(value || "").normalize("NFKC").replace(/[ー－―‐ｰ]/g, "-").replace(/[^0-9+]/g, "");
              if (s.startsWith("+81")) s = "0" + s.slice(3);
              if (s.startsWith("0081")) s = "0" + s.slice(4);
              return s.replace(/\D/g, "");
            }
            function sessionToken() { return sessionStorage.getItem(SESSION_KEY) || ""; }
            function staffCode() { return String(document.getElementById("dproStaffCode")?.value || "").trim(); }

            async function secureLogin(adminCode) {
              const existing = sessionToken();
              if (existing) return existing;
              if (!adminCode) return "";
              if (authPromise) return authPromise;
              authPromise = (async () => {
                const endpoint = ROLE === "staff" ? "/api/auth/staff/login" : "/api/auth/owner/login";
                const body = ROLE === "staff" ? { code: adminCode, staff_code: staffCode() } : { code: adminCode };
                if (ROLE === "staff" && !body.staff_code) throw new Error("スタッフコードを入力してください。");
                const u = new URL(API_BASE + endpoint);
                u.searchParams.set("company_code", COMPANY_CODE);
                const r = await RAW_FETCH(u.toString(), { method: "POST", headers: { "content-type": "application/json", "accept": "application/json" }, body: JSON.stringify(body), cache: "no-store" });
                const data = await r.json().catch(() => ({}));
                if (!r.ok || data.ok === false || !data.session?.token) throw new Error(data?.error?.message || "ログインを確認できませんでした。");
                sessionStorage.setItem(SESSION_KEY, data.session.token);
                window.setTimeout(() => { sessionStorage.removeItem("dpro_disposal_admin"); sessionStorage.removeItem("dpro_disposal_staff_admin"); }, 600);
                return data.session.token;
              })();
              try { return await authPromise; } finally { authPromise = null; }
            }

            async function revokeSecureSession() {
              const token = sessionToken();
              sessionStorage.removeItem(SESSION_KEY);
              sessionStorage.removeItem("dpro_disposal_admin");
              sessionStorage.removeItem("dpro_disposal_staff_admin");
              if (!token) return;
              try {
                const u = new URL(API_BASE + "/api/auth/session/revoke");
                u.searchParams.set("company_code", COMPANY_CODE);
                await RAW_FETCH(u.toString(), { method: "POST", headers: { "content-type": "application/json", "authorization": "Bearer " + token }, body: "{}", cache: "no-store" });
              } catch (_) {}
            }

            function loadLiffScript() {
              if (window.liff) return Promise.resolve();
              return new Promise((resolve, reject) => {
                const existing = document.querySelector('script[data-dpro-liff="1"]');
                if (existing) { existing.addEventListener("load", resolve, { once: true }); existing.addEventListener("error", reject, { once: true }); return; }
                const s = document.createElement("script");
                s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
                s.async = true; s.dataset.dproLiff = "1"; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
              });
            }
            async function lineIdToken() {
              if (!CFG.LIFF_ID) return "";
              if (!liffInitPromise) liffInitPromise = (async () => { await loadLiffScript(); await window.liff.init({ liffId: CFG.LIFF_ID }); return true; })();
              try { await liffInitPromise; return window.liff.isLoggedIn() ? (window.liff.getIDToken() || "") : ""; } catch (_) { return ""; }
            }

            function scrubJsonBody(body) {
              if (!body || typeof body !== "object") return body;
              if (Object.prototype.hasOwnProperty.call(body, "line_user_id")) delete body.line_user_id;
              if (body.customer && typeof body.customer === "object") {
                if (Object.prototype.hasOwnProperty.call(body.customer, "line_user_id")) delete body.customer.line_user_id;
                if (typeof body.customer.phone === "string") body.customer.phone = normalizePhone(body.customer.phone);
              }
              if (typeof body.phone === "string") body.phone = normalizePhone(body.phone);
              return body;
            }

            window.fetch = async function dproDisposalSecureFetch(resource, options = {}) {
              const sourceUrl = resource instanceof Request ? resource.url : String(resource || "");
              let url;
              try { url = new URL(sourceUrl, window.location.href); } catch { return RAW_FETCH(resource, options); }
              if (!url.toString().startsWith(API_BASE)) return RAW_FETCH(resource, options);
              const next = { ...options };
              const headers = new Headers(resource instanceof Request ? resource.headers : undefined);
              new Headers(options.headers || {}).forEach((v, k) => headers.set(k, v));
              headers.set("X-DPRO-Frontend-Version", CFG.FRONTEND_VERSION);
              if (IS_DEMO) headers.set("X-DPRO-Demo", "1");
              if (ROLE !== "public") headers.set("X-DPRO-Client-Role", ROLE);
              if (ROLE === "staff" && staffCode()) headers.set("X-DPRO-Staff-Id", staffCode());
              if (url.searchParams.has("line_user_id")) url.searchParams.delete("line_user_id");
              if (url.pathname.endsWith("/api/admin/customers/search") && url.searchParams.has("q")) {
                const q = url.searchParams.get("q") || "", n = normalizePhone(q); if (n.length >= 10) url.searchParams.set("q", n);
              }
              const contentType = String(headers.get("content-type") || "").toLowerCase();
              if (typeof next.body === "string" && contentType.includes("application/json")) { try { next.body = JSON.stringify(scrubJsonBody(JSON.parse(next.body))); } catch (_) {} }
              const idToken = await lineIdToken(); if (idToken) headers.set("X-Line-ID-Token", idToken);
              if (url.pathname.includes("/api/admin/")) {
                let token = sessionToken();
                const rawAdmin = String(headers.get("x-admin-code") || "").trim();
                if (!token && rawAdmin && ROLE !== "public") token = await secureLogin(rawAdmin);
                if (token) { headers.delete("x-admin-code"); headers.set("authorization", "Bearer " + token); }
              }
              next.headers = headers;
              return RAW_FETCH(url.toString(), next);
            };

            function injectStaffCodeField() {
              if (page !== "staff.html" || document.getElementById("dproStaffCode")) return;
              const admin = document.getElementById("adminCode"), field = admin?.closest(".field");
              if (!field?.parentElement) return;
              const wrap = document.createElement("div"); wrap.className = "field"; wrap.style.marginBottom = "12px";
              const label = document.createElement("label"); label.htmlFor = "dproStaffCode"; label.textContent = "スタッフコード";
              const input = document.createElement("input"); input.id = "dproStaffCode"; input.autocomplete = "username"; input.maxLength = 50; input.placeholder = "例：FIELD-01"; if (IS_DEMO) input.value = "FIELD-01";
              const help = document.createElement("div"); help.className = "help"; help.textContent = "スタッフごとの権限で安全にログインします。";
              wrap.append(label, input, help); field.parentElement.insertBefore(wrap, field);
            }

            const replacements = new Map([
              ["API接続中", "接続確認中"], ["API接続OK", "接続正常"], ["API接続エラー", "接続を確認"], ["APIエラー", "接続を確認"],
              ["APIへ接続できないため、画面確認用データを表示しています。", "最新情報を取得できないため、画面確認用データを表示しています。"],
              ["API応答を取得できなかったため、画面確認用データを表示しています。", "最新情報を取得できないため、画面確認用データを表示しています。"]
            ]);
            function cleanVisibleTechnicalText(root = document.body) {
              if (!root || page === "system-check.html") return;
              const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
              while (walker.nextNode()) nodes.push(walker.currentNode);
              for (const node of nodes) { const text = node.nodeValue || ""; let next = text; replacements.forEach((to, from) => { next = next.split(from).join(to); }); if (next !== text) node.nodeValue = next; }
            }

            window.addEventListener("DOMContentLoaded", () => {
              injectStaffCodeField(); cleanVisibleTechnicalText();
              if (page !== "system-check.html") {
                const observer = new MutationObserver(mutations => { for (const m of mutations) m.addedNodes.forEach(n => { if (n.nodeType === Node.TEXT_NODE && n.parentElement) cleanVisibleTechnicalText(n.parentElement); else if (n.nodeType === Node.ELEMENT_NODE) cleanVisibleTechnicalText(n); }); });
                observer.observe(document.body, { childList: true, subtree: true });
              } else document.querySelectorAll("footer").forEach(f => { f.textContent = f.textContent.replace("DISPOSAL-7-R1", CFG.FRONTEND_VERSION); });
              const logout = document.getElementById("logoutBtn"); if (logout) logout.addEventListener("click", () => { revokeSecureSession(); }, { capture: true });
              if (!IS_DEMO || !["owner.html", "staff.html"].includes(page)) return;
              const adminCode = document.getElementById("adminCode"), loginButton = document.getElementById("loginBtn"), appView = document.getElementById("appView");
              if (!adminCode || !loginButton || (appView && !appView.classList.contains("hidden"))) return;
              adminCode.value = "1234";
              window.setTimeout(() => { if (appView && !appView.classList.contains("hidden")) return; loginButton.click(); }, 120);
            });
          })();
          DPRO_CONFIG_EOF
          node --check config.js
          grep -F "$ADAPTER_BASE" config.js
          grep -F "$FRONTEND_VERSION" config.js
          grep -F 'X-Line-ID-Token' config.js
          grep -F 'dproStaffCode' config.js
          grep -F '0081' config.js
          if grep -F 'API_BASE: "https://dpro-disposal-line-api.dpromstk2000.workers.dev"' config.js; then
            echo 'Legacy API is still configured as browser API_BASE' >&2
            exit 3
          fi
          sha256sum config.js > product-ready-evidence/disposal-r2/config-sha256.txt

      - name: Runtime security probes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          base=os.environ['ADAPTER_BASE'].rstrip('/')
          def call(path,method='GET',body=None,headers=None,accept=(200,)):
              data=None if body is None else json.dumps(body).encode()
              h={'Accept':'application/json','User-Agent':'DPRO-DISPOSAL-R2-QA',**(headers or {})}
              if body is not None: h['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      status=r.status; raw=r.read().decode(); obj=json.loads(raw or '{}')
              except urllib.error.HTTPError as e:
                  status=e.code; raw=e.read().decode(); obj=json.loads(raw or '{}')
              if status not in accept:
                  raise SystemExit(f'{path} HTTP {status} not in {accept}: {obj}')
              return status,obj
          result={}
          _,check=call('/api/product-ready/check?company_code=dpro_disposal_demo')
          assert check.get('ok') is True and check.get('versionsAligned') is True, check
          assert check.get('versions',{}).get('frontend')==os.environ['FRONTEND_VERSION']
          assert check.get('versions',{}).get('adapter')==os.environ['ADAPTER_VERSION']
          assert check.get('versions',{}).get('database')==os.environ['DATABASE_VERSION']
          sec=check.get('security',{})
          assert sec.get('strictCors') is True and sec.get('rawLineUserIdAuthoritative') is False
          assert sec.get('database',{}).get('rlsEnabled')==sec.get('database',{}).get('disposalTables')==18
          assert sec.get('database',{}).get('appointmentGuard') is True
          assert sec.get('database',{}).get('demoPrepareServiceRoleOnly') is True
          assert sec.get('photo',{}).get('privateBucket') is True
          line=sec.get('lineIdToken',{})
          assert line.get('wrongAudRejected') and line.get('expiredRejected') and line.get('validClaimAccepted')
          result['product_ready_check']={'status':200,'ok':True,'versionsAligned':True,'security':sec,'phoneNormalization':check.get('phoneNormalization'),'integration':check.get('integration'),'versions':check.get('versions')}

          status,raw=call('/api/public/returning-customer?company_code=dpro_disposal_demo&line_user_id=raw-client-id',accept=(401,))
          assert raw.get('error',{}).get('code')=='RAW_LINE_ID_REJECTED',raw
          result['raw_line_user_id_rejected']={'status':status,'code':raw.get('error',{}).get('code')}

          status,cors=call('/api/health?company_code=dpro_disposal_demo',headers={'Origin':'https://evil.example'},accept=(403,))
          assert cors.get('error',{}).get('code')=='ORIGIN_NOT_ALLOWED',cors
          result['strict_cors_negative']={'status':status,'code':cors.get('error',{}).get('code')}

          _,staff_login=call('/api/auth/staff/login?company_code=dpro_disposal_demo','POST',{'code':'1234','staff_code':'FIELD-01'})
          staff_token=staff_login['session']['token']
          assert staff_login['session']['role']=='field'
          sh={'Authorization':'Bearer '+staff_token}
          status,_=call('/api/admin/cases?company_code=dpro_disposal_demo&limit=5',headers=sh)
          result['staff_read']={'status':status}
          status,denied=call('/api/admin/payments/save?company_code=dpro_disposal_demo','POST',{},sh,accept=(403,))
          assert denied.get('error',{}).get('code')=='CAPABILITY_DENIED',denied
          result['field_owner_mutation_denied']={'status':status,'code':'CAPABILITY_DENIED'}

          jst=datetime.timezone(datetime.timedelta(hours=9)); now=datetime.datetime.now(jst)
          past=(now-datetime.timedelta(days=1)).replace(hour=10,minute=0,second=0,microsecond=0)
          status,past_obj=call('/api/admin/appointments/save?company_code=dpro_disposal_demo','POST',{'case_id':'00000000-0000-0000-0000-000000000000','appointment_type':'follow_up','status':'scheduled','start_at':past.isoformat(),'end_at':(past+datetime.timedelta(minutes=30)).isoformat()},sh,accept=(400,))
          assert past_obj.get('error',{}).get('code')=='APPOINTMENT_PAST_REJECTED',past_obj
          result['past_time_rejected']={'status':status,'code':'APPOINTMENT_PAST_REJECTED'}
          future=(now+datetime.timedelta(days=2)).replace(hour=10,minute=15,second=0,microsecond=0)
          status,slot_obj=call('/api/admin/appointments/save?company_code=dpro_disposal_demo','POST',{'case_id':'00000000-0000-0000-0000-000000000000','appointment_type':'follow_up','status':'scheduled','start_at':future.isoformat(),'end_at':(future+datetime.timedelta(minutes=30)).isoformat()},sh,accept=(400,))
          assert slot_obj.get('error',{}).get('code')=='APPOINTMENT_30_MINUTE_REQUIRED',slot_obj
          result['non_30_minute_rejected']={'status':status,'code':'APPOINTMENT_30_MINUTE_REQUIRED'}
          status,_=call('/api/auth/session/revoke?company_code=dpro_disposal_demo','POST',{},sh)
          result['staff_revoke']={'status':status}
          status,revoked=call('/api/admin/cases?company_code=dpro_disposal_demo&limit=1',headers=sh,accept=(401,))
          result['revoked_session_rejected']={'status':status,'code':revoked.get('error',{}).get('code')}

          _,owner_login=call('/api/auth/owner/login?company_code=dpro_disposal_demo','POST',{'code':'1234'})
          owner_token=owner_login['session']['token']; oh={'Authorization':'Bearer '+owner_token}
          status,_=call('/api/admin/dashboard?company_code=dpro_disposal_demo',headers=oh)
          result['owner_dashboard']={'status':status}
          status,demo=call('/api/admin/demo-prepare?company_code=dpro_disposal_demo','POST',{},oh)
          assert demo.get('ok') is True,demo
          result['demo_prepare']={'status':status,'ok':True}
          status,_=call('/api/auth/session/revoke?company_code=dpro_disposal_demo','POST',{},oh)
          result['owner_revoke']={'status':status}

          with open('product-ready-evidence/disposal-r2/runtime-security-qa.json','w',encoding='utf-8') as f:
              json.dump({'ok':True,'result':result},f,ensure_ascii=False,indent=2)
          print(json.dumps({'ok':True,'checks':list(result)},ensure_ascii=False))
          PY

      - name: Commit R2 source before deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.js product-ready-evidence/disposal-r2/source-guard.txt product-ready-evidence/disposal-r2/config-sha256.txt product-ready-evidence/disposal-r2/runtime-security-qa.json
          git commit -m 'DISPOSAL R2 source remediation' || true
          git push
          git rev-parse HEAD > product-ready-evidence/disposal-r2/source-head.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'product-ready-evidence/' \
            --exclude 'node_modules/' \
            --exclude '*.zip'
          touch _site/.nojekyll
          grep -F "$FRONTEND_VERSION" _site/config.js
          grep -F "$ADAPTER_BASE" _site/config.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request
          urls={
            'config':os.environ['FRONT_BASE']+'/config.js?qa=pr2',
            'demo_guide':os.environ['FRONT_BASE']+'/demo-guide.html?qa=pr2',
            'index':os.environ['FRONT_BASE']+'/index.html?demo=1&qa=pr2',
            'member':os.environ['FRONT_BASE']+'/member.html?demo=1&qa=pr2',
            'owner':os.environ['FRONT_BASE']+'/owner.html?demo=1&qa=pr2',
            'staff':os.environ['FRONT_BASE']+'/staff.html?demo=1&qa=pr2',
            'system_check':os.environ['FRONT_BASE']+'/system-check.html?demo=1&qa=pr2',
            'product':os.environ['PRODUCT_URL']+'?qa=pr2',
            'lp':os.environ['LP_URL']+'?qa=pr2',
            'a4_html':os.environ['A4_HTML_URL']+'?qa=pr2',
            'a4_pdf':os.environ['A4_PDF_URL']+'?qa=pr2',
          }
          out={}
          for k,u in urls.items():
              req=urllib.request.Request(u,headers={'User-Agent':'DPRO-DISPOSAL-R2-QA'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=r.read(); out[k]={'status':r.status,'bytes':len(data),'content_type':r.headers.get('content-type')}
                  if r.status!=200: raise SystemExit(f'{k} HTTP {r.status}')
                  if k=='config' and os.environ['FRONTEND_VERSION'].encode() not in data: raise SystemExit('deployed config version mismatch')
          with open('product-ready-evidence/disposal-r2/public-url-qa.json','w') as f: json.dump({'ok':True,'urls':out},f,indent=2)
          PY

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh Chromium responsive and system-check QA
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/disposal-browser-qa.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = process.env.FRONT_BASE;
          const scenarios = [
            {name:'owner_pc_1440',path:'/owner.html?demo=1&qa=pr2',width:1440,height:1000,wait:'#appView:not(.hidden)'},
            {name:'index_mobile_390',path:'/index.html?demo=1&qa=pr2',width:390,height:844},
            {name:'index_mobile_320',path:'/index.html?demo=1&qa=pr2',width:320,height:720},
            {name:'owner_ipad_1024',path:'/owner.html?demo=1&qa=pr2',width:1024,height:768,wait:'#appView:not(.hidden)'},
            {name:'staff_mobile_390',path:'/staff.html?demo=1&qa=pr2',width:390,height:844,wait:'#appView:not(.hidden)'}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true}); const results=[];
            for(const s of scenarios){
              const page=await browser.newPage({viewport:{width:s.width,height:s.height}}); const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              const resp=await page.goto(base+s.path,{waitUntil:'networkidle',timeout:60000});
              if(s.wait) await page.waitForSelector(s.wait,{timeout:30000});
              await page.waitForTimeout(1200);
              const metrics=await page.evaluate(()=>({
                innerWidth:window.innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                text:document.body.innerText,
                staffCode:document.getElementById('dproStaffCode')?.value||'',
                ownerSession:!!sessionStorage.getItem('dpro_disposal_owner_session'),
                staffSession:!!sessionStorage.getItem('dpro_disposal_staff_session')
              }));
              const technical=/API接続|APIエラー|Supabase|service_role|Database|Worker/.test(metrics.text);
              const ok=resp?.status()===200 && metrics.scrollWidth<=metrics.innerWidth && errors.length===0 && !technical && (!s.name.startsWith('owner_')||metrics.ownerSession) && (s.name!=='staff_mobile_390'||(metrics.staffSession&&metrics.staffCode==='FIELD-01'));
              await page.screenshot({path:`product-ready-evidence/disposal-r2/screens/${s.name}.png`,fullPage:true});
              results.push({...s,httpStatus:resp?.status(),innerWidth:metrics.innerWidth,scrollWidth:metrics.scrollWidth,horizontalOverflow:Math.max(0,metrics.scrollWidth-metrics.innerWidth),pageErrors:errors,technicalExposure:technical,ownerSession:metrics.ownerSession,staffSession:metrics.staffSession,staffCodeReady:metrics.staffCode==='FIELD-01',ok});
              await page.close();
            }
            const sc=await browser.newPage({viewport:{width:1440,height:1000}}); const scErrors=[]; sc.on('pageerror',e=>scErrors.push(String(e.message||e)));
            const sr=await sc.goto(base+'/system-check.html?demo=1&qa=pr2',{waitUntil:'networkidle',timeout:60000});
            await sc.click('#runBtn');
            await sc.waitForFunction(()=>{ const x=document.getElementById('overall')?.textContent||''; return x && !['未チェック','確認中'].includes(x); },{timeout:90000});
            const sys=await sc.evaluate(()=>({overall:document.getElementById('overall')?.textContent,pass:Number(document.getElementById('passCount')?.textContent||0),warn:Number(document.getElementById('warnCount')?.textContent||0),fail:Number(document.getElementById('failCount')?.textContent||0),pending:Number(document.getElementById('pendingCount')?.textContent||0),report:document.getElementById('reportText')?.value||''}));
            await sc.screenshot({path:'product-ready-evidence/disposal-r2/screens/system_check_1440.png',fullPage:true});
            const sysOk=sr?.status()===200&&sys.fail===0&&sys.pending===0&&scErrors.length===0;
            const out={ok:results.every(x=>x.ok)&&sysOk,scenarios:results,systemCheck:{httpStatus:sr?.status(),...sys,pageErrors:scErrors,ok:sysOk}};
            fs.writeFileSync('product-ready-evidence/disposal-r2/browser-qa.json',JSON.stringify(out,null,2));
            fs.writeFileSync('product-ready-evidence/disposal-r2/system-check-report.txt',sys.report+'\n');
            await browser.close();
            if(!out.ok){ console.error(JSON.stringify(out,null,2)); process.exit(1); }
            console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/disposal-browser-qa.js

      - name: Final static checks and evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os
          from pathlib import Path
          runtime=json.loads(Path('product-ready-evidence/disposal-r2/runtime-security-qa.json').read_text())
          browser=json.loads(Path('product-ready-evidence/disposal-r2/browser-qa.json').read_text())
          public=json.loads(Path('product-ready-evidence/disposal-r2/public-url-qa.json').read_text())
          cfg=Path('config.js').read_text()
          checks={
            'runtime_security':runtime.get('ok') is True,
            'browser_qa':browser.get('ok') is True,
            'public_urls':public.get('ok') is True,
            'adapter_bound':os.environ['ADAPTER_BASE'] in cfg,
            'frontend_version':os.environ['FRONTEND_VERSION'] in cfg,
            'raw_line_not_authoritative':'line_user_id' in cfg and 'delete body.line_user_id' in cfg,
            'line_id_token_bridge':'X-Line-ID-Token' in cfg,
            'individual_staff_code':'dproStaffCode' in cfg,
            'phone_0081':'0081' in cfg,
          }
          out={'ok':all(checks.values()),'checks':checks,'frontendVersion':os.environ['FRONTEND_VERSION'],'adapterVersion':os.environ['ADAPTER_VERSION'],'databaseVersion':os.environ['DATABASE_VERSION']}
          Path('product-ready-evidence/disposal-r2/final-qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          Path('product-ready-evidence/disposal-r2/R2_QA_PASS.txt').write_text('STATUS=PASS\nBLOCKING_RUNTIME_QA=0\nSTALE_EVIDENCE=0\nFINAL_LOCK_SELF_CONFIRMED=NO\n')
          if not out['ok']: raise SystemExit(out)
          PY

      - name: Commit evidence and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/STEP-DISPOSAL-PRODUCT-READY-R2.yml
          git add config.js product-ready-evidence/disposal-r2
          git commit -m 'DISPOSAL R2 QA evidence'
          git push
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
