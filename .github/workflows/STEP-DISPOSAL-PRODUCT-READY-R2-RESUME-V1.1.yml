name: DPRO DISPOSAL Product READY R2 Fresh QA Resume V1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-DISPOSAL-PRODUCT-READY-R2-RESUME-V1.1.yml'

permissions:
  contents: write

concurrency:
  group: dpro-disposal-product-ready-r2-resume
  cancel-in-progress: false

env:
  EXPECTED_SOURCE: 58d89a5361c4b78c2035aeeed699e41ef796247b
  ADAPTER_BASE: https://cbknucemarcpbscirzyv.supabase.co/functions/v1/dpro-disposal-control-adapter
  FRONT_BASE: https://dpromstk2000-lab.github.io/dpro-disposal-line-liff
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/disposal.html
  LP_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-disposal.html
  A4_HTML_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-disposal.html
  A4_PDF_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-disposal.pdf
  FRONTEND_VERSION: DISPOSAL-PR2-FRONTEND-20260824
  ADAPTER_VERSION: DPRO-CONTROL-ADAPTER-1.0-DISPOSAL-20260824-R2
  DATABASE_VERSION: DISPOSAL-DB-PR2-20260824

jobs:
  fresh-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard remediated source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_SOURCE" HEAD
          grep -F "$ADAPTER_BASE" config.js
          grep -F "$FRONTEND_VERSION" config.js
          grep -F 'X-Line-ID-Token' config.js
          grep -F 'dproStaffCode' config.js
          grep -F '0081' config.js
          test -f product-ready-evidence/disposal-r2/runtime-security-qa.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('product-ready-evidence/disposal-r2/runtime-security-qa.json').read_text())
          assert x.get('ok') is True, x
          r=x['result']
          assert r['product_ready_check']['versionsAligned'] is True
          assert r['raw_line_user_id_rejected']['status']==401
          assert r['strict_cors_negative']['status']==403
          assert r['field_owner_mutation_denied']['status']==403
          assert r['past_time_rejected']['status']==400
          assert r['non_30_minute_rejected']['status']==400
          assert r['revoked_session_rejected']['status']==401
          PY

      - name: Wait for existing GitHub Pages branch publish
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            body="$(curl -fsSL --max-time 20 "$FRONT_BASE/config.js?qa=disposal-r2-resume-$i" || true)"
            if printf '%s' "$body" | grep -Fq "$FRONTEND_VERSION" && printf '%s' "$body" | grep -Fq "$ADAPTER_BASE"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Fresh public URL QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/disposal-r2/screens
          python3 - <<'PY'
          import json, os, urllib.request
          urls={
            'config':os.environ['FRONT_BASE']+'/config.js?qa=disposal-r2-final',
            'demo_guide':os.environ['FRONT_BASE']+'/demo-guide.html?qa=disposal-r2-final',
            'index':os.environ['FRONT_BASE']+'/index.html?demo=1&qa=disposal-r2-final',
            'member':os.environ['FRONT_BASE']+'/member.html?demo=1&qa=disposal-r2-final',
            'owner':os.environ['FRONT_BASE']+'/owner.html?demo=1&qa=disposal-r2-final',
            'staff':os.environ['FRONT_BASE']+'/staff.html?demo=1&qa=disposal-r2-final',
            'system_check':os.environ['FRONT_BASE']+'/system-check.html?demo=1&qa=disposal-r2-final',
            'product':os.environ['PRODUCT_URL']+'?qa=disposal-r2-final',
            'lp':os.environ['LP_URL']+'?qa=disposal-r2-final',
            'a4_html':os.environ['A4_HTML_URL']+'?qa=disposal-r2-final',
            'a4_pdf':os.environ['A4_PDF_URL']+'?qa=disposal-r2-final',
          }
          out={}
          for key,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'DPRO-DISPOSAL-R2-FRESH-QA','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read()
              out[key]={'status':r.status,'bytes':len(b),'content_type':r.headers.get('content-type','')}
              assert r.status==200,(key,r.status)
              if key=='config':
                assert os.environ['FRONTEND_VERSION'].encode() in b
                assert os.environ['ADAPTER_BASE'].encode() in b
          Path='product-ready-evidence/disposal-r2/public-url-qa.json'
          open(Path,'w').write(json.dumps({'ok':True,'urls':out},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Fresh adapter recheck
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base=os.environ['ADAPTER_BASE'].rstrip('/')
          def call(path,method='GET',body=None,headers=None,accept=(200,)):
            h={'Accept':'application/json','User-Agent':'DPRO-DISPOSAL-R2-FRESH-QA',**(headers or {})}
            data=None
            if body is not None:
              h['Content-Type']='application/json'; data=json.dumps(body).encode()
            req=urllib.request.Request(base+path,data=data,headers=h,method=method)
            try:
              with urllib.request.urlopen(req,timeout=30) as r: status=r.status; text=r.read().decode()
            except urllib.error.HTTPError as e:
              status=e.code; text=e.read().decode()
            obj=json.loads(text or '{}')
            assert status in accept,(path,status,obj)
            return status,obj
          result={}
          _,check=call('/api/product-ready/check?company_code=dpro_disposal_demo')
          assert check.get('ok') is True and check.get('versionsAligned') is True,check
          result['product_ready_check']=check
          status,obj=call('/api/public/returning-customer?company_code=dpro_disposal_demo&line_user_id=raw-only',accept=(401,))
          assert obj.get('error',{}).get('code')=='RAW_LINE_ID_REJECTED',obj
          result['raw_line_rejected']={'status':status,'code':obj['error']['code']}
          status,obj=call('/api/product-ready/check?company_code=dpro_disposal_demo',headers={'Origin':'https://evil.example'},accept=(403,))
          assert obj.get('error',{}).get('code')=='ORIGIN_NOT_ALLOWED',obj
          result['cors_negative']={'status':status,'code':obj['error']['code']}
          _,login=call('/api/auth/staff/login?company_code=dpro_disposal_demo','POST',{'code':'1234','staff_code':'FIELD-01'})
          token=login['session']['token']; sh={'Authorization':'Bearer '+token}
          status,obj=call('/api/admin/payments/save?company_code=dpro_disposal_demo','POST',{},sh,accept=(403,))
          assert obj.get('error',{}).get('code')=='CAPABILITY_DENIED',obj
          result['field_payment_denied']={'status':status,'code':obj['error']['code']}
          call('/api/auth/session/revoke?company_code=dpro_disposal_demo','POST',{},sh)
          status,obj=call('/api/admin/cases?company_code=dpro_disposal_demo&limit=1',headers=sh,accept=(401,))
          assert status==401
          result['revoke_rejected']={'status':status,'code':obj.get('error',{}).get('code')}
          open('product-ready-evidence/disposal-r2/runtime-security-qa-fresh.json','w').write(json.dumps({'ok':True,'result':result},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "console.log(require.resolve('playwright'))"

      - name: Fresh Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/disposal-r2-browser.js" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base=process.env.FRONT_BASE;
          const scenarios=[
            {name:'owner_pc_1440',path:'/owner.html?demo=1&qa=r2final',w:1440,h:1000,wait:'#appView:not(.hidden)',owner:true},
            {name:'index_mobile_390',path:'/index.html?demo=1&qa=r2final',w:390,h:844},
            {name:'index_mobile_320',path:'/index.html?demo=1&qa=r2final',w:320,h:720},
            {name:'owner_ipad_1024',path:'/owner.html?demo=1&qa=r2final',w:1024,h:768,wait:'#appView:not(.hidden)',owner:true},
            {name:'staff_mobile_390',path:'/staff.html?demo=1&qa=r2final',w:390,h:844,wait:'#appView:not(.hidden)',staff:true},
            {name:'member_mobile_390',path:'/member.html?demo=1&qa=r2final',w:390,h:844}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true}); const results=[];
            for(const s of scenarios){
              const p=await browser.newPage({viewport:{width:s.w,height:s.h}});
              const pageErrors=[], consoleErrors=[], failedRequests=[], badResponses=[];
              p.on('pageerror',e=>pageErrors.push(String(e.message||e)));
              p.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
              p.on('requestfailed',r=>{ if(['document','script','stylesheet','xhr','fetch'].includes(r.resourceType())) failedRequests.push({url:r.url(),error:r.failure()?.errorText||'',type:r.resourceType()}); });
              p.on('response',r=>{ if(['document','script','stylesheet','xhr','fetch'].includes(r.request().resourceType()) && r.status()>=400) badResponses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}); });
              const resp=await p.goto(base+s.path,{waitUntil:'networkidle',timeout:60000});
              if(s.wait) await p.waitForSelector(s.wait,{timeout:30000});
              await p.waitForTimeout(1200);
              const m=await p.evaluate(()=>({innerWidth:innerWidth,scrollWidth:document.documentElement.scrollWidth,text:document.body.innerText,ownerSession:!!sessionStorage.getItem('dpro_disposal_owner_session'),staffSession:!!sessionStorage.getItem('dpro_disposal_staff_session'),staffCode:document.getElementById('dproStaffCode')?.value||''}));
              const technical=/API接続|APIエラー|Supabase|service_role|Database|Worker/.test(m.text);
              const ok=resp?.status()===200 && m.scrollWidth<=m.innerWidth && pageErrors.length===0 && consoleErrors.length===0 && failedRequests.length===0 && badResponses.length===0 && !technical && (!s.owner||m.ownerSession) && (!s.staff||(m.staffSession&&m.staffCode==='FIELD-01'));
              await p.screenshot({path:`product-ready-evidence/disposal-r2/screens/${s.name}.png`,fullPage:true});
              results.push({...s,httpStatus:resp?.status(),innerWidth:m.innerWidth,scrollWidth:m.scrollWidth,horizontalOverflow:Math.max(0,m.scrollWidth-m.innerWidth),pageErrors,consoleErrors,failedRequests,badResponses,technicalExposure:technical,ownerSession:m.ownerSession,staffSession:m.staffSession,staffCodeReady:m.staffCode==='FIELD-01',ok});
              await p.close();
            }
            const p=await browser.newPage({viewport:{width:1440,height:1000}}); const pageErrors=[],consoleErrors=[],failedRequests=[],badResponses=[];
            p.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            p.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            p.on('requestfailed',r=>{ if(['document','script','stylesheet','xhr','fetch'].includes(r.resourceType())) failedRequests.push({url:r.url(),error:r.failure()?.errorText||'',type:r.resourceType()}); });
            p.on('response',r=>{if(['document','script','stylesheet','xhr','fetch'].includes(r.request().resourceType())&&r.status()>=400)badResponses.push({url:r.url(),status:r.status(),type:r.request().resourceType()})});
            const resp=await p.goto(base+'/system-check.html?demo=1&qa=r2final',{waitUntil:'networkidle',timeout:60000});
            await p.click('#runBtn');
            await p.waitForFunction(()=>{const x=document.getElementById('overall')?.textContent||'';return x&&!['未チェック','確認中'].includes(x)},{timeout:90000});
            const sys=await p.evaluate(()=>({overall:document.getElementById('overall')?.textContent||'',pass:Number(document.getElementById('passCount')?.textContent||0),warn:Number(document.getElementById('warnCount')?.textContent||0),fail:Number(document.getElementById('failCount')?.textContent||0),pending:Number(document.getElementById('pendingCount')?.textContent||0),report:document.getElementById('reportText')?.value||''}));
            await p.screenshot({path:'product-ready-evidence/disposal-r2/screens/system_check_1440.png',fullPage:true});
            const sysOk=resp?.status()===200&&sys.fail===0&&sys.pending===0&&pageErrors.length===0&&consoleErrors.length===0&&failedRequests.length===0&&badResponses.length===0;
            const out={ok:results.every(x=>x.ok)&&sysOk,scenarios:results,systemCheck:{httpStatus:resp?.status(),...sys,pageErrors,consoleErrors,failedRequests,badResponses,ok:sysOk}};
            fs.writeFileSync('product-ready-evidence/disposal-r2/browser-qa.json',JSON.stringify(out,null,2));
            fs.writeFileSync('product-ready-evidence/disposal-r2/system-check-report.txt',sys.report+'\n');
            await browser.close();
            console.log(JSON.stringify(out,null,2));
            if(!out.ok) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node "$GITHUB_WORKSPACE/disposal-r2-browser.js"

      - name: Final QA evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          runtime=json.loads(Path('product-ready-evidence/disposal-r2/runtime-security-qa-fresh.json').read_text())
          browser=json.loads(Path('product-ready-evidence/disposal-r2/browser-qa.json').read_text())
          public=json.loads(Path('product-ready-evidence/disposal-r2/public-url-qa.json').read_text())
          checks={'runtime_security':runtime.get('ok') is True,'browser_qa':browser.get('ok') is True,'public_urls':public.get('ok') is True}
          out={'ok':all(checks.values()),'checks':checks,'sourceHeadAtQa':os.environ.get('GITHUB_SHA'),'frontendVersion':os.environ['FRONTEND_VERSION'],'adapterVersion':os.environ['ADAPTER_VERSION'],'databaseVersion':os.environ['DATABASE_VERSION'],'finalLockSelfConfirmed':'NO'}
          Path('product-ready-evidence/disposal-r2/final-qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          Path('product-ready-evidence/disposal-r2/R2_QA_PASS.txt').write_text('STATUS=PASS\nBLOCKING_RUNTIME_QA=0\nSTALE_EVIDENCE=0\nFINAL_LOCK_SELF_CONFIRMED=NO\n')
          assert out['ok'] is True,out
          PY

      - name: Commit evidence and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/STEP-DISPOSAL-PRODUCT-READY-R2.yml || true
          git rm -f .github/workflows/STEP-DISPOSAL-PRODUCT-READY-R2-RESUME.yml || true
          git rm -f .github/workflows/STEP-DISPOSAL-PRODUCT-READY-R2-RESUME-V1.1.yml || true
          rm -f disposal-r2-browser.js
          git add product-ready-evidence/disposal-r2 config.js
          git commit -m 'DISPOSAL R2 QA evidence'
          git push
